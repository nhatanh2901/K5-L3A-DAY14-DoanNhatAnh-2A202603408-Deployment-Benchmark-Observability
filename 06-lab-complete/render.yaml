# Blueprint path: 06-lab-complete/render.yaml (paths below are repo-relative).
services:
  - type: web
    name: k5-day14-agent
    runtime: docker
    plan: free
    region: singapore
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: k5-day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: '10'
      - key: DAILY_BUDGET_USD
        value: '1'
      - key: MONTHLY_BUDGET_USD
        value: '10'
  - type: keyvalue
    name: k5-day14-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: 'off'
